<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuenta Regresiva Mundial 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
}

.contenedor{
    text-align:center;
    padding:30px;
    border-radius:25px;

    background:linear-gradient(
        135deg,
        rgba(108,190,255,0.95),
        rgba(0,45,98,0.95)
    );

    border:4px solid gold;

    box-shadow:
    0 0 20px rgba(255,215,0,.8),
    0 0 40px rgba(255,215,0,.6);
}

.copa{
    width:180px;
    margin-bottom:15px;
    animation:flotar 3s ease-in-out infinite;
}

@keyframes flotar{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
    100%{
        transform:translateY(0);
    }
}

.titulo{
    font-size:42px;
    color:white;
    text-shadow:3px 3px 8px black;
    margin-bottom:15px;
}

.subtitulo{
    font-size:20px;
    color:white;
    margin-bottom:20px;
}

#contador{
    color:white;
    font-size:58px;
    font-weight:bold;
    line-height:1.3;
    text-shadow:3px 3px 8px black;
}

.footer{
    margin-top:20px;
    color:#fff;
    font-size:18px;
    letter-spacing:2px;
}

</style>
</head>

<body>

<div class="contenedor">

    <img src="copa.png" alt="Copa Mundial" class="copa">

    <div class="titulo">
        ⚽ MUNDIAL 2026 ⚽
    </div>

    <div class="subtitulo">
        Faltan:
    </div>

    <div id="contador">
        Cargando...
    </div>

    <div class="footer">
        🇦🇷 ARGENTINA 🇦🇷
    </div>

</div>

<script>

const fechaMundial = new Date("2026-06-11T00:00:00");

function actualizarContador(){

    const ahora = new Date();
    const diferencia = fechaMundial - ahora;

    if(diferencia <= 0){
        document.getElementById("contador").innerHTML =
        "⚽ ¡COMENZÓ EL MUNDIAL!";
        return;
    }

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutos = Math.floor(
        (diferencia % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const segundos = Math.floor(
        (diferencia % (1000 * 60))
        / 1000
    );

    document.getElementById("contador").innerHTML =
    `
    ${dias} días<br>
    ${horas}h ${minutos}m ${segundos}s
    `;
}

actualizarContador();
setInterval(actualizarContador, 1000);

</script>

</body>
</html>
