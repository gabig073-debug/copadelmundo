<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url('fondo.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* CONTENEDOR DEL CONTADOR */

#contador{
    position:absolute;

    /* AJUSTAR ESTOS VALORES SI HACE FALTA */
    top:49%;
    left:67%;

    transform:translate(-50%,-50%);

    display:flex;
    gap:45px;

    text-align:center;
}

.bloque{
    width:140px;
}

.numero{

    color:#FFFFFF;

    font-size:95px;
    font-weight:900;

    text-shadow:
        0px 0px 8px rgba(0,0,0,.8),
        0px 0px 20px rgba(0,0,0,.8);

    line-height:1;
}

.etiqueta{

    margin-top:8px;

    color:#FFD700;

    font-size:24px;
    font-weight:bold;

    text-shadow:
        0px 0px 8px rgba(0,0,0,.8);
}

</style>
</head>

<body>

<div id="contador">

    <div class="bloque">
        <div class="numero" id="dias">000</div>
        <div class="etiqueta">DÍAS</div>
    </div>

    <div class="bloque">
        <div class="numero" id="horas">00</div>
        <div class="etiqueta">HORAS</div>
    </div>

    <div class="bloque">
        <div class="numero" id="minutos">00</div>
        <div class="etiqueta">MINUTOS</div>
    </div>

    <div class="bloque">
        <div class="numero" id="segundos">00</div>
        <div class="etiqueta">SEGUNDOS</div>
    </div>

</div>

<script>

const fechaMundial = new Date("2026-06-11T00:00:00");

function actualizarContador(){

    const ahora = new Date();

    const diferencia = fechaMundial - ahora;

    if(diferencia <= 0){

        document.getElementById("dias").textContent = "000";
        document.getElementById("horas").textContent = "00";
        document.getElementById("minutos").textContent = "00";
        document.getElementById("segundos").textContent = "00";

        return;
    }

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutos = Math.floor(
        (diferencia % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const segundos = Math.floor(
        (diferencia % (1000 * 60))
        / 1000
    );

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent =
        String(horas).padStart(2,"0");

    document.getElementById("minutos").textContent =
        String(minutos).padStart(2,"0");

    document.getElementById("segundos").textContent =
        String(segundos).padStart(2,"0");
}

actualizarContador();

setInterval(actualizarContador,1000);

</script>

</body>
</html>
