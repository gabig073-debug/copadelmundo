<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
    font-family:'Bebas Neue', sans-serif;
}

.contenedor{

    display:flex;
    align-items:center;
    gap:40px;

    padding:30px 40px;

    background:linear-gradient(
        135deg,
        rgba(0,25,60,.95),
        rgba(0,70,150,.95)
    );

    border:4px solid #FFD700;

    border-radius:25px;

    box-shadow:
        0 0 20px rgba(255,215,0,.8),
        0 0 40px rgba(255,215,0,.5);

}

/* COPA */

.copa{

    width:260px;

    animation:flotar 3s ease-in-out infinite;

}

@keyframes flotar{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

.info{
    text-align:center;
}

/* FALTAN PARA EL */

.subtitulo{

    color:white;

    font-size:42px;

    letter-spacing:3px;

    margin-bottom:5px;

    text-shadow:
        0 0 10px rgba(0,0,0,.8);

}

/* MUNDIAL 2026 */

.titulo{

    color:white;

    font-size:100px;

    line-height:0.9;

    letter-spacing:1px;

    margin-bottom:25px;

    text-shadow:
        0 0 10px rgba(0,0,0,.8),
        0 0 20px rgba(0,0,0,.8);

}

.titulo span{

    color:#FFD700;

    text-shadow:
        0 0 10px rgba(255,215,0,.5),
        0 0 20px rgba(255,215,0,.3);

}

/* CONTADOR */

#contador{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:25px;

    padding:25px 35px;

    background:rgba(0,0,20,.90);

    border:3px solid #FFD700;

    border-radius:20px;

    box-shadow:
        0 0 20px rgba(255,215,0,.8),
        inset 0 0 20px rgba(255,215,0,.2);

}

.bloque{

    text-align:center;

    min-width:130px;

}

.numero{

    color:white;

    font-size:95px;

    line-height:1;

    text-shadow:
        0 0 10px rgba(0,0,0,.9),
        0 0 20px rgba(0,0,0,.9);

}

.texto{

    color:#FFD700;

    font-size:30px;

    letter-spacing:1px;

}

.separador{

    width:2px;

    height:120px;

    background:rgba(255,255,255,.4);

}

/* ARGENTINA */

.footer{

    margin-top:20px;

    color:white;

    font-size:34px;

    letter-spacing:2px;

    text-shadow:
        0 0 10px rgba(0,0,0,.8);

}

</style>
</head>

<body>

<div class="contenedor">

    <img src="copa.png" class="copa">

    <div class="info">

        <div class="subtitulo">
            ★ FALTAN PARA EL ★
        </div>

        <div class="titulo">
            MUNDIAL <span>2026</span>
        </div>

        <div id="contador">

            <div class="bloque">
                <div class="numero" id="dias">000</div>
                <div class="texto">DÍAS</div>
            </div>

            <div class="separador"></div>

            <div class="bloque">
                <div class="numero" id="horas">00</div>
                <div class="texto">HORAS</div>
            </div>

            <div class="separador"></div>

            <div class="bloque">
                <div class="numero" id="minutos">00</div>
                <div class="texto">MINUTOS</div>
            </div>

            <div class="separador"></div>

            <div class="bloque">
                <div class="numero" id="segundos">00</div>
                <div class="texto">SEGUNDOS</div>
            </div>

        </div>

        <div class="footer">
            🇦🇷 ARGENTINA 🇦🇷
        </div>

    </div>

</div>

<script>

const fechaMundial = new Date("2026-06-11T16:00:00-03:00");

function actualizarContador(){

    const ahora = new Date();

    const diferencia = fechaMundial - ahora;

    if(diferencia <= 0){

        document.getElementById("dias").textContent = "000";
        document.getElementById("horas").textContent = "00";
        document.getElementById("minutos").textContent = "00";
        document.getElementById("segundos").textContent = "00";

        return;
    }

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutos = Math.floor(
        (diferencia % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const segundos = Math.floor(
        (diferencia % (1000 * 60))
        / 1000
    );

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent = String(horas).padStart(2,"0");
    document.getElementById("minutos").textContent = String(minutos).padStart(2,"0");
    document.getElementById("segundos").textContent = String(segundos).padStart(2,"0");
}

actualizarContador();

setInterval(actualizarContador,1000);

</script>

</body>
</html>
