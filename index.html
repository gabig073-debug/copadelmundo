<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
    font-family:'Bebas Neue', sans-serif;
}

.contenedor{

    display:flex;
    align-items:center;
    gap:40px;

    padding:30px 40px;

    background:linear-gradient(
        135deg,
        rgba(0,40,85,.95),
        rgba(0,90,180,.95)
    );

    border:4px solid #FFD700;

    border-radius:25px;

    box-shadow:
    0 0 20px rgba(255,215,0,.8),
    0 0 40px rgba(255,215,0,.5);
}

.copa{

    width:260px;

    animation:flotar 3s ease-in-out infinite;
}

@keyframes flotar{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

.info{
    text-align:center;
}

/* FALTAN PARA EL */

.subtitulo{

    color:white;

    font-size:38px;

    letter-spacing:3px;

    margin-bottom:5px;

    text-shadow:
    0 0 10px rgba(0,0,0,.8);
}

/* MUNDIAL 2026 */

.titulo{

    color:white;

    font-size:95px;

    line-height:0.9;

    letter-spacing:1px;

    text-transform:uppercase;

    text-shadow:
    0 3px 0 rgba(0,0,0,.8),
    0 0 20px rgba(0,0,0,.8);

    margin-bottom:20px;
}

.titulo span{

    color:#FFD700;

    text-shadow:
    0 0 10px rgba(255,215,0,.5),
    0 0 20px rgba(255,215,0,.3);
}

/* CONTADOR */

#contador{

    color:white;

    font-size:70px;

    line-height:1.1;

    text-shadow:
    0 0 10px rgba(0,0,0,.8),
    0 0 20px rgba(0,0,0,.8);

    margin-top:10px;
}

/* ARGENTINA */

.footer{

    margin-top:20px;

    color:white;

    font-size:32px;

    letter-spacing:2px;

    text-shadow:
    0 0 10px rgba(0,0,0,.8);
}

</style>
</head>

<body>

<div class="contenedor">

    <img src="copa.png" class="copa">

    <div class="info">

        <div class="subtitulo">
            ★ FALTAN PARA EL ★
        </div>

        <div class="titulo">
            MUNDIAL <span>2026</span>
        </div>

        <div id="contador">
            Cargando...
        </div>

        <div class="footer">
            🇦🇷 ARGENTINA 🇦🇷
        </div>

    </div>

</div>

<script>

const fechaMundial = new Date("2026-06-11T00:00:00");

function actualizarContador(){

    const ahora = new Date();

    const diferencia = fechaMundial - ahora;

    if(diferencia <= 0){

        document.getElementById("contador").innerHTML =
        "⚽ ¡COMENZÓ EL MUNDIAL!";

        return;
    }

    const dias =
    Math.floor(diferencia / (1000 * 60 * 60 * 24));

    const horas =
    Math.floor(
        (diferencia % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutos =
    Math.floor(
        (diferencia % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const segundos =
    Math.floor(
        (diferencia % (1000 * 60))
        / 1000
    );

    document.getElementById("contador").innerHTML =
    `
    ${dias} días<br>
    ${String(horas).padStart(2,'0')}h
    ${String(minutos).padStart(2,'0')}m
    ${String(segundos).padStart(2,'0')}s
    `;
}

actualizarContador();

setInterval(actualizarContador, 1000);

</script>

</body>
</html>
