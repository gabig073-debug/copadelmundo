<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
}

.contenedor{

    display:flex;
    align-items:center;
    gap:40px;

    padding:30px 40px;

    background:linear-gradient(
        135deg,
        rgba(0,40,85,.95),
        rgba(0,90,180,.95)
    );

    border:4px solid #FFD700;

    border-radius:25px;

    box-shadow:
    0 0 20px rgba(255,215,0,.8),
    0 0 40px rgba(255,215,0,.5);

}

.copa{

    width:220px;

    animation:flotar 3s ease-in-out infinite;

}

@keyframes flotar{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

.info{
    text-align:center;
}

.titulo{

    color:white;
    font-size:50px;
    font-weight:bold;

    text-shadow:
    0 0 10px #000,
    0 0 20px #000;

    margin-bottom:15px;

}

.subtitulo{

    color:#FFD700;
    font-size:24px;
    font-weight:bold;

    margin-bottom:20px;

}

#contador{

    color:white;
    font-size:60px;
    font-weight:bold;

    text-shadow:
    0 0 10px #000,
    0 0 20px #000;

    line-height:1.3;

}

.footer{

    margin-top:20px;

    color:white;

    font-size:22px;

    font-weight:bold;

}

</style>
</head>

<body>

<div class="contenedor">

    <img src="copa.png" class="copa">

    <div class="info">

        <div class="titulo">
            ⚽ MUNDIAL 2026
        </div>

        <div class="subtitulo">
            CUENTA REGRESIVA
        </div>

        <div id="contador">
            Cargando...
        </div>

        <div class="footer">
            🇦🇷 ARGENTINA 🇦🇷
        </div>

    </div>

</div>

<script>

const fechaMundial = new Date("2026-06-11T00:00:00");

function actualizarContador(){

    const ahora = new Date();

    const diferencia = fechaMundial - ahora;

    if(diferencia <= 0){

        document.getElementById("contador").innerHTML =
        "⚽ ¡COMENZÓ EL MUNDIAL!";

        return;
    }

    const dias =
    Math.floor(diferencia / (1000 * 60 * 60 * 24));

    const horas =
    Math.floor(
        (diferencia % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutos =
    Math.floor(
        (diferencia % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const segundos =
    Math.floor(
        (diferencia % (1000 * 60))
        / 1000
    );

    document.getElementById("contador").innerHTML =
    `
    ${dias} días<br>
    ${horas}h ${minutos}m ${segundos}s
    `;
}

actualizarContador();

setInterval(actualizarContador, 1000);

</script>

</body>
</html>
