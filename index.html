<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url("estadio.jpg") center center no-repeat;
    background-size:cover;
}

/* COPA */

#copa{

    position:absolute;

    left:20px;
    bottom:20px;

    height:850px;

    z-index:2;

    filter:
        drop-shadow(0 0 20px rgba(255,215,0,.8))
        drop-shadow(0 0 40px rgba(255,215,0,.6));
}

/* TITULO */

.titulo{

    position:absolute;

    top:40px;
    left:62%;

    transform:translateX(-50%);

    text-align:center;

    color:white;

    z-index:10;

    text-shadow:
    0 0 10px #000,
    0 0 20px #000;
}

.linea1{

    font-size:40px;

    font-weight:bold;

    letter-spacing:2px;
}

.linea2{

    font-size:120px;

    font-weight:900;
}

.linea2 span{

    color:#FFD700;
}

/* CONTADOR */

#contador{

    position:absolute;

    top:55%;
    left:65%;

    transform:translate(-50%,-50%);

    display:flex;

    gap:35px;

    padding:25px 35px;

    background:rgba(0,0,0,.45);

    border:3px solid #FFD700;

    border-radius:20px;

    box-shadow:
    0 0 20px rgba(255,215,0,.8),
    inset 0 0 20px rgba(255,215,0,.3);

    z-index:10;
}

.bloque{

    width:150px;

    text-align:center;
}

.numero{

    color:white;

    font-size:95px;

    font-weight:900;

    line-height:1;

    text-shadow:
    0 0 10px #000,
    0 0 20px #000;
}

.etiqueta{

    color:#FFD700;

    font-size:26px;

    font-weight:bold;

    margin-top:5px;
}

/* FRASE */

.frase{

    position:absolute;

    bottom:40px;

    width:100%;

    text-align:center;

    color:white;

    font-size:42px;

    font-weight:bold;

    text-shadow:
    0 0 10px #000,
    0 0 20px #000;

    z-index:10;
}

</style>
</head>

<body>

<img src="copa.png" id="copa">

<div class="titulo">

    <div class="linea1">
        FALTAN PARA EL
    </div>

    <div class="linea2">
        MUNDIAL <span>2026</span>
    </div>

</div>

<div id="contador">

    <div class="bloque">
        <div class="numero" id="dias">000</div>
        <div class="etiqueta">DÍAS</div>
    </div>

    <div class="bloque">
        <div class="numero" id="horas">00</div>
        <div class="etiqueta">HORAS</div>
    </div>

    <div class="bloque">
        <div class="numero" id="minutos">00</div>
        <div class="etiqueta">MINUTOS</div>
    </div>

    <div class="bloque">
        <div class="numero" id="segundos">00</div>
        <div class="etiqueta">SEGUNDOS</div>
    </div>

</div>

<div class="frase">
    LA ILUSIÓN DE TODO UN PAÍS
</div>

<script>

const fechaObjetivo = new Date("2026-06-11T00:00:00");

function actualizar(){

    const ahora = new Date();

    const diferencia = fechaObjetivo - ahora;

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutos = Math.floor(
        (diferencia % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const segundos = Math.floor(
        (diferencia % (1000 * 60))
        / 1000
    );

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent = String(horas).padStart(2,"0");
    document.getElementById("minutos").textContent = String(minutos).padStart(2,"0");
    document.getElementById("segundos").textContent = String(segundos).padStart(2,"0");
}

actualizar();
setInterval(actualizar,1000);

</script>

</body>
</html>
