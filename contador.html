<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuenta Regresiva Mundial</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f0f0f0; }
        #contador { font-size: 2em; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Faltan para el Mundial</h1>
    <div id="contador"></div>

    <script>
        // Poné la fecha y hora del inicio del Mundial
        const fechaMundial = new Date('2026-11-08T12:00:00'); // Año, mes, día, hora

        function actualizarContador() {
            const ahora = new Date();
            const diferencia = fechaMundial - ahora;

            if (diferencia <= 0) {
                document.getElementById('contador').innerHTML = "¡El Mundial ha comenzado!";
                return;
            }

            const segundos = Math.floor((diferencia / 1000) % 60);
            const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
            const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));

            document.getElementById('contador').innerHTML = 
                dias + " días, " + 
                horas + " horas, " + 
                minutos + " minutos, " + 
                segundos + " segundos";
        }

        // Actualizar cada segundo
        setInterval(actualizarContador, 1000);
    </script>
</body>
</html>
